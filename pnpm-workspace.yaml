  '@tailwindcss/postcss': 4.3.3
  '@types/mdast': 4.0.4
  '@types/mdx': 2.0.14
  '@types/node': 25.1.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  fumadocs-core: 16.16.2
  fumadocs-mdx: 15.4.6
  fumadocs-ui: npm:@fumadocs/base-ui@16.16.2
  jsdom: 30.0.1
  next: 16.3.8
  postcss: 8.5.28
  react: 19.3.0
  react-dom: 19.3.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
