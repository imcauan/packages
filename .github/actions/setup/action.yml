name: Set up workspace
description: Install the pinned Node.js and pnpm toolchain and the workspace dependencies.

inputs:
  registry-url:
    description: Registry to authenticate against with NODE_AUTH_TOKEN. Only needed to publish.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
        scope: '@imcauan'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
