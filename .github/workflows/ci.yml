name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # changeset status compares against origin/main

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      # Before knip, typecheck and tests: they read sibling packages from dist.
      - name: Build
        run: pnpm build

      - name: Unused code and dependencies
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Fails when a published package changed and the branch has no
      # changeset. The version PR consumes changesets, so it's exempt.
      - name: Changeset status
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since=origin/main

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up workspace
        uses: ./.github/actions/setup

      # Statically generates every page; fails on broken links in any doc.
      - name: Build the docs site
        run: pnpm docs:build
        env:
          DOCS_BASE_PATH: /packages
